<!-- editor.rs render_pane: the tab row (tabs, then Settings and the window buttons), then the shown tab.
     A temporary tab's title is italic; double click keeps it. A right press opens the tab menu without showing the tab.
     The row scrolls sideways (Shift+wheel or a touchpad); a tab dragged along it moves to the gap the accent bar marks. -->
<section class="pane">
  <div class="tabbar">
  <div class="tabs" @wheel="scrollTabs($event)">
    <!-- ident.js (a proposal): flat, one group of every tab; or a group per worktree or per project under its head.
         The chevron folds the group to its head, its count and its current tab (the one shown last); a click on the
         name lists the group's tabs in a menu, to show another. -->
    <template x-for="g in tabGroups()" :key="g.key">
    <div class="tabs__group" :class="{ 'tabs__group--on': g.head !== null, 'tabs__group--folded': g.folded }" :style="{ '--co': g.colour || 'transparent' }">
    <template x-if="g.head">
      <span class="tabs__head">
      <button class="tabs__head-fold" type="button" @click="toggleTabGroup(g.key)" :title="(g.folded ? 'Unfold ' : 'Fold ') + g.head.label"><img class="icon tabs__head-chevron" :src="icon(g.folded ? 'chevron-right.svg' : 'chevron-down.svg')" alt="" /></button>
      <button class="tabs__head-name" type="button" @click.stop="openTabGroupMenu(g.key, $event)" :title="g.head.label + (g.head.sub ? ' · ' + g.head.sub : '') + ': its tabs'"><template x-if="g.head.owner"><span class="owner" :title="g.head.owner.module ? g.head.owner.project + ' › ' + g.head.owner.module : g.head.owner.project"><template x-if="g.head.owner.icon"><img class="owner__icon" :src="g.head.owner.icon" alt="" /></template><template x-if="g.head.owner.icon === null"><span class="owner__initials" x-text="g.head.owner.initials"></span></template></span></template><span class="tabs__head-label" x-text="g.head.label"></span><template x-if="g.folded"><span class="tabs__head-count" x-text="g.tabs.length"></span></template></button>
      </span>
    </template>
    <template x-for="tab in g.shown" :key="tab.key">
      <div class="tabs__tab" :class="{ 'tabs__tab--current': focus === tab.key }" :data-place="tabs.indexOf(tab)" x-data="{ get cue() { return tabWorktreeCue(tab); }, get owner() { return tabOwnerIcon(tab); }, get badge() { return tabOwnerBadge(tab); } }"
           :style="cue && cue.mode === 'tint' ? { '--tint': cue.colour } : {}" :data-tint="cue && cue.mode === 'tint' ? '' : null"
           @click="showTab(tab)" @dblclick="keepTab(tab)" @auxclick.prevent="$event.button === 1 && closeTab(tab)" :title="tabTooltip(tab)"
           @mousedown="if ($event.button === 0) pressTab(tab, $event); if ($event.button === 2) { $event.stopPropagation(); openTabMenu(tab, $event.clientX, $event.clientY); }" @contextmenu.prevent @dragstart.prevent
           x-effect="focus === tab.key && $nextTick(() => $el.scrollIntoView({ block: 'nearest', inline: 'nearest' }))">
        <template x-if="owner"><span class="owner" :title="owner.module ? owner.project + ' › ' + owner.module : owner.project"><template x-if="owner.icon"><img class="owner__icon" :src="owner.icon" alt="" /></template><template x-if="owner.icon === null"><span class="owner__initials" x-text="owner.initials"></span></template></span></template>
        <span class="icon-stack"><img class="icon" :src="icon(tabIcon(tab))" alt="" /><template x-if="tab.kind === 'scratch'"><img class="icon icon-stack__badge" :src="icon('scratch.svg')" alt="" /></template><template x-if="badge"><img class="icon-stack__owner" :src="badge.icon" alt="" :title="badge.module ? badge.project + ' › ' + badge.module : badge.project" /></template></span>
        <template x-if="cue && cue.mode === 'dot'"><span class="tabs__dot" :style="{ background: cue.colour }"></span></template>
        <span class="tabs__title" :class="{ 'tabs__title--temporary': isTemporary(tab) }" x-text="tabTitle(tab)"></span>
        <template x-if="cue && cue.mode === 'label'"><span class="tabs__where" :style="cue.colour ? { '--co': cue.colour } : {}" x-text="cue.label"></span></template>
        <button class="tab__close" type="button" title="Close" @click.stop="closeTab(tab)">
          <img class="icon" :src="icon('close.svg')" alt="" />
        </button>
        <template x-if="tabUnderline(tab)"><span class="tabs__underline" :style="{ background: tabUnderline(tab) }"></span></template>
        <template x-if="tabDropSide(tabs.indexOf(tab))"><span class="tabs__drop" :class="'tabs__drop--' + tabDropSide(tabs.indexOf(tab))"></span></template>
      </div>
    </template>
    </div>
    </template>
  </div>
  <div class="tabbar__tools" x-include="components/checkouts/tab-tools.html"></div>
  </div>
  <!-- ident.js (a proposal): a tab group's menu, its tabs, the group's current one ticked; a project group's under a
       head per worktree, with the worktree's rail as in the tree -->
  <template x-for="m in (tabGroupMenu() ? [tabGroupMenu()] : [])" :key="m.key">
    <!-- a tab drags within its worktree, a worktree's head among the project's; a line marks where it lands -->
    <div class="menu menu--at" :style="{ left: m.x + 'px', top: m.y + 'px' }" role="menu" @mousedown.outside="menu = null" @dragstart.prevent>
      <template x-for="s in tabGroupSections(m.group)" :key="s.key">
        <div class="menu__wt" :data-menu-section="s.key" :data-drop="identMenuDrag && identMenuDrag.kind === 'section' ? groupMenuDropSide(s.key) : null">
          <template x-if="s.label">
            <div class="menu__section menu__section--wt" :class="{ 'menu__section--rail': s.colour, 'menu__section--grab': s.key !== 'project' }" :style="s.colour ? { '--wt': s.colour } : {}"
                 @mousedown="$event.button === 0 && s.key !== 'project' && pressGroupMenu({ kind: 'section', key: s.key, section: s.key }, $event)">
              <img class="icon" :src="icon(s.key === 'project' ? 'project-folder.svg' : 'branch.svg')" alt="" /><span x-text="s.label"></span>
            </div>
          </template>
          <template x-for="tab in s.tabs" :key="tab.key">
            <button class="menu__item" type="button" role="menuitem" :data-menu-tab="tab.key" :data-section="s.key"
                    :data-drop="identMenuDrag && identMenuDrag.kind === 'tab' ? groupMenuDropSide(tab.key) : null"
                    @mousedown="$event.button === 0 && pressGroupMenu({ kind: 'tab', key: tab.key, section: s.key }, $event)"
                    @click="if (identMenuDragged === false) { menu = null; showTab(tab); }">
              <span class="menu__tick" x-text="tab.key === m.group.current.key ? '✓' : ''"></span>
              <span class="icon-stack" x-data="{ get badge() { return tabModuleBadge(tab); } }"><img class="icon" :src="icon(tabIcon(tab))" alt="" /><template x-if="badge"><img class="icon-stack__owner" :src="badge.icon" alt="" :title="badge.project + ' › ' + badge.module" /></template></span>
              <span class="menu__grow" x-text="tabTitle(tab)"></span>
            </button>
          </template>
        </div>
      </template>
    </div>
  </template>
  <!-- DraggedTab: the dragged tab's title under the pointer -->
  <template x-if="tabDrag !== null">
    <div class="tabs__drag" :style="{ left: tabDrag.x + 'px', top: tabDrag.y + 'px' }" x-text="tabDrag.title"></div>
  </template>

  <!-- workspace/menu.rs: the menu of a tab or a tree row (menus.js). A tab's: Keep Tab (temporary tab), Stop and Kill
       (process tab; greyed with nothing in the foreground), a file's items, then the Close items (greyed with nothing to
       close there). A tree row's: Send to Terminal ▸, Open in Terminal, Run, Find in Files…, Copy Path ▸, Open In ▸, Git ▸.
       A submenu opens beside its line on hover or click. Escape or a press outside closes it. -->
  <template x-for="m in (contextMenu() ? [contextMenu()] : [])" :key="menu">
    <div class="menu menu--at" :style="{ left: m.at.x + 'px', top: m.at.y + 'px' }" role="menu"
         x-init="$nextTick(() => keepMenuInWindow($el, m.at))" @mousedown.outside="menu = null" @contextmenu.prevent>
      <template x-for="(item, i) in m.items" :key="i">
        <div class="menu__line">
          <template x-if="item === null"><div class="menu__separator" role="separator"></div></template>
          <template x-if="item !== null">
            <button class="menu__item" type="button" role="menuitem" :disabled="item.enabled === false" @click="runMenuItem(item)"
                    @mouseenter="menuSub = item.items ? item : null" :class="{ 'menu__item--open': menuSub !== null && menuSub.title === item.title }">
              <span class="menu__grow" x-text="item.title"></span>
              <template x-if="item.items"><span class="menu__arrow">▸</span></template>
            </button>
          </template>
          <template x-if="item !== null && item.items && menuSub !== null && menuSub.title === item.title">
            <div class="menu menu__sub" role="menu">
              <template x-for="(sub, j) in item.items" :key="j">
                <div>
                  <template x-if="sub === null"><div class="menu__separator" role="separator"></div></template>
                  <template x-if="sub !== null">
                    <button class="menu__item" type="button" role="menuitem" :disabled="sub.enabled === false" @click="runMenuItem(sub)" x-text="sub.title"></button>
                  </template>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>
    </div>
  </template>

  <template x-if="currentTab() === null">
    <p class="pane__message muted">Open a file, process or overview from the tree</p>
  </template>

  <!-- x-for over [x], not x-if: inner bindings must never see the tab vanish mid-teardown. -->
  <template x-for="c in (currentTab() && currentTab().kind === 'console' ? [consoleOf(currentTab())] : [])" :key="c.id">
    <div class="terminal" :class="'terminal--' + c.kind" @click="$el.querySelector('input') && $el.querySelector('input').focus()">
      <template x-for="(line, i) in c.lines" :key="i">
        <div class="terminal__line">
          <template x-if="isPromptLine(line)">
            <span><span class="terminal__user" x-text="line.prompt.user"></span>:<span class="terminal__dir"
              x-text="line.prompt.dir"></span><template x-if="line.prompt.branch"><span class="terminal__branch"
              x-text="' (' + line.prompt.branch + ')'"></span></template>$ <span class="terminal__text" x-text="line.command"></span></span>
          </template>
          <template x-if="isPromptLine(line) === false"><span class="terminal__text" x-text="line"></span></template>
        </div>
      </template>

      <template x-if="c.kind === 'shell'">
        <div class="terminal__line terminal__line--input">
          <span class="terminal__user" x-text="prompt(c.co).user"></span>:<span class="terminal__dir"
            x-text="prompt(c.co).dir"></span><template x-if="prompt(c.co).branch"><span class="terminal__branch"
            x-text="' (' + prompt(c.co).branch + ')'"></span></template>$&nbsp;<input class="terminal__input"
            x-model="c.input" @keydown.enter="submit(c)" x-init="$nextTick(() => $el.focus())" spellcheck="false" autocomplete="off" />
        </div>
      </template>
      <!-- a run's tab (planned): output only, no Stop inside; stopped and restarted from its row in Processes -->
      <template x-if="c.kind === 'run' && c.state === 'running'">
        <div class="terminal__line muted" x-text="c.serve ? '(serving; live reload on)' : '(running)'"></div>
      </template>
      <template x-if="c.kind === 'agent'">
        <div class="terminal__line terminal__line--input terminal__agent-input">&gt;&nbsp;<input class="terminal__input" x-model="c.input" @keydown.enter="submit(c)" x-init="$nextTick(() => $el.focus())"
                           placeholder="Ask Claude…" spellcheck="false" autocomplete="off" />
        </div>
      </template>
    </div>
  </template>

  <template x-for="p in (currentTab() && currentTab().kind === 'projectPage' ? [project(currentTab().project)] : [])" :key="p.name">
    <div class="fill" x-include="components/checkouts/project-page.html"></div>
  </template>
  <template x-for="tab in (currentTab() && currentTab().kind === 'vars' ? [currentTab()] : [])" :key="tab.key">
    <div class="fill" x-include="components/checkouts/vars-tab.html"></div>
  </template>  <template x-for="p in (currentTab() && currentTab().kind === 'gitLog' ? [project(currentTab().project)] : [])" :key="p.name">
    <div class="fill" x-include="components/checkouts/git-log-tab.html"></div>
  </template>
  <template x-for="tab in (currentTab() && currentTab().kind === 'commit' ? [currentTab()] : [])" :key="tab.key">
    <div class="fill" x-include="components/checkouts/commit-tab.html"></div>
  </template>
  <template x-for="tab in (currentTab() && currentTab().kind === 'settings' ? [currentTab()] : [])" :key="tab.key">
    <div class="fill" x-include="components/checkouts/settings.html"></div>
  </template>
  <template x-for="tab in (currentTab() && currentTab().kind === 'runConfigs' ? [currentTab()] : [])" :key="tab.key">
    <div class="fill" x-include="components/checkouts/run-configs-tab.html"></div>
  </template>
  <template x-for="tab in (currentTab() && currentTab().kind === 'hub' ? [currentTab()] : [])" :key="tab.key">
    <div class="fill" x-include="components/checkouts/hub.html"></div>
  </template>

  <!-- overview/diff_tab.rs: header (mark, path, source, Reload), then the diff. -->
  <template x-for="tab in (currentTab() && currentTab().kind === 'diff' ? [currentTab()] : [])" :key="tab.key">
    <div class="difftab" x-data="{ get d() { return diffOfTab(tab); } }">
      <div class="diffpane__head">
        <span class="mark" :class="'mark--' + tab.mark" x-text="tab.mark"></span>
        <span class="diffpane__name diffpane__name--full" x-text="tab.path"></span>
        <span class="muted diffpane__source" x-text="sourceText(checkout(tab.co), tab.source)"></span>
        <template x-if="d === null"><span class="muted diffpane__source" x-text="'No changes to ' + tab.path + ' any more.'"></span></template>
        <span class="diffpane__state muted" x-text="tab.conflict || tab.error ? '' : tab.saving ? 'saving…' : isEditable(tab) ? 'editable' : 'read-only'"
              :title="isEditable(tab) ? 'The new side is editable; saved as you type, no Ctrl+S' : 'Read-only: only a diff of uncommitted changes can be edited'"></span>
        <div class="segmented" role="group" aria-label="Diff layout">
          <button type="button" :aria-pressed="String(layoutOf(tab) === 'inline')" @click="setLayout(tab, 'inline')">Inline</button>
          <button type="button" :aria-pressed="String(layoutOf(tab) === 'side')" @click="setLayout(tab, 'side')">Side by side</button>
        </div>
        <button class="toggle" type="button"><img class="icon" :src="icon('history.svg')" alt="" /><span>Reload</span></button>
      </div>
      <div x-include="components/checkouts/savebar.html"></div>
      <div x-include="components/checkouts/find.html"></div>
      <div class="diff" data-find-scroll x-data="{ get rows() { return d ? diffRows(d.diff, tab.path) : []; } }" x-include="components/checkouts/diff-lines.html"></div>
    </div>
  </template>

  <!-- A file (editor.rs EditorView) or a scratch (scratch/tab.rs: a header line, then the text). -->
  <template x-for="tab in (currentTab() && (currentTab().kind === 'file' || currentTab().kind === 'scratch') ? [currentTab()] : [])" :key="tab.key">
    <div class="pane__body">
      <template x-if="tab.kind === 'scratch'">
        <div class="scratch__header">
          <span class="scratch__where" x-text="scratchHeader(tab)"></span>
          <template x-if="isShellScratch(tab.title)">
            <button class="scratch__run" type="button"><img class="icon" :src="icon('run.svg')" alt="" /><span>Run</span></button>
          </template>
        </div>
      </template>
      <div x-include="components/checkouts/savebar.html"></div>
      <!-- A textarea over the coloured lines types into the text; it is as tall and wide as the text, so the box scrolls both. -->
      <div x-include="components/checkouts/find.html"></div>
      <div class="editor editor--static" data-find-scroll :style="{ '--gutter-chars': String(lines(tab).length).length + 1 }">
        <div class="editor__sheet" :style="{ height: lines(tab).length * 21 + 'px', width: editorWidth(tab) }">
          <template x-for="(tokens, i) in codeLines(tab)" :key="i">
            <!-- tab.line: where a jump (the hub's :42 or file:line) put it, marked and scrolled into view -->
            <div class="editor__line" :class="{ 'editor__line--at': tab.line === i + 1 }"
                 x-effect="tab.line === i + 1 && $nextTick(() => $el.scrollIntoView({ block: 'center' }))">
              <span class="editor__number" x-text="i + 1"></span>
              <span class="editor__text"><template x-for="(tk, j) in tokens" :key="j"><span :class="tk.k && 'syn-' + tk.k" x-text="tk.t"></span></template></span>
            </div>
          </template>
          <textarea class="editor__input" spellcheck="false" wrap="off" :value="lines(tab).join('\n')" @input="edited(tab, $event.target.value)"
                    :style="{ height: lines(tab).length * 21 + 'px' }"></textarea>
        </div>
      </div>
      <div class="codestatus">
        <span class="codestatus__save" x-text="tab.conflict || tab.error ? '' : tab.saving ? 'saving…' : ''"></span>
        <span class="muted" :title="isBig(tab) ? 'Files over 8 MiB are shown without colours' : 'Files over 8 MiB are shown without colours'"
              x-text="isBig(tab) ? 'over 8 MiB: no colours' : languageName(tab)"></span>
        <span class="muted">UTF-8</span>
      </div>
    </div>
  </template>
</section>
