<!-- editor.rs render_tab_row: right end of the tab row; there is no title bar. Restart (only with run's
     --restart, not mocked), Settings (20 px icon), then window_controls.rs: 46 px buttons, icons drawn in the text colour (white over the
     red close hover). -->
  <!-- A proposal (DESIGN.md "Attention"): the processes that called, longest waiting first; only while there are any.
       A row shows the process with the window in front, which clears it. -->
  <template x-if="waitingConsoles().length">
    <div class="anchor" @click.outside="menu === 'waiting' && (menu = null)">
      <button class="icon-button" type="button" :title="waitingConsoles().length + ' waiting'" @click="toggleMenu('waiting')">
        <span class="icon-stack icon-stack--20"><img class="icon icon--20" :src="icon('notifications-20.svg')" alt="Waiting" /><span class="attention-dot"></span></span>
      </button>
      <div class="menu menu--waiting" x-show="menu === 'waiting'">
        <div class="menu__section">Waiting, longest first</div>
        <template x-for="c in waitingConsoles()" :key="c.id">
          <button class="menu__item menu__item--two" type="button" @click="showWaiting(c)" :title="label(c.co) + ' — ' + c.title">
            <img class="icon" :src="icon(consoleIcon(c))" alt="" />
            <span class="menu__grow">
              <span class="waiting__title" x-text="c.title + ' · ' + label(c.co)"></span>
              <span class="waiting__text" x-text="c.attention ? c.attention.text : ''"></span>
            </span>
            <span class="waiting__age" x-text="c.attention ? age(c.attention.at) : ''"></span>
          </button>
        </template>
      </div>
    </div>
  </template>
  <!-- mock-only, not part of IVE: every control of the mock, in one menu by Settings; a pick closes it -->
  <div class="anchor" @click.outside="menu === 'mock' && (menu = null)">
    <button class="icon-button" type="button" title="Mock controls (not part of IVE)" @click="toggleMenu('mock')">
      <img class="icon" :src="icon('dock.svg')" alt="Mock controls" />
    </button>
    <div class="menu menu--mock" x-show="menu === 'mock'" @click="$event.target.closest('.menu__item') && (menu = null)">
      <!-- DESIGN.md "Where a tab belongs" -->
      <div class="menu__section">Tabs</div>
      <button class="menu__item" type="button" @click="openIdentDemo()" title="The same names in several worktrees, projects and modules">
        <span class="menu__tick"></span><span class="menu__grow">Open demo tabs</span>
      </button>
      <!-- codeview "Saving": the shown file, scratch or uncommitted diff tab -->
      <div class="menu__section">Save the shown tab</div>
      <button class="menu__item" type="button" @click="mockSave('disk')" title="The file changed on disk: Reload, Overwrite"><span class="menu__grow">Conflict</span></button>
      <button class="menu__item" type="button" @click="mockSave('big')" title="A file over 8 MiB: only Reload"><span class="menu__grow">Conflict, over 8 MiB</span></button>
      <button class="menu__item" type="button" @click="mockSave('error')" title="cannot save: Permission denied; then close the tab"><span class="menu__grow">Error</span></button>
      <button class="menu__item" type="button" @click="mockSave(null)"><span class="menu__grow">Clear</span></button>
      <!-- DESIGN.md "Attention": what a program in a terminal sends; IVE's window in front or behind -->
      <div class="menu__section">A process calls</div>
      <button class="menu__item" type="button" @click="mockAttention('notify')" title="OSC 9 / 777 / 99 with a text, as Claude Code or Codex send it (ignored by the shown tab while the window is in front)"><span class="menu__grow">Notification</span></button>
      <button class="menu__item" type="button" @click="mockAttention('bell')" title="BEL"><span class="menu__grow">Bell</span></button>
      <button class="menu__item" type="button" @click="mockAttention('done')" title="OSC 9;4 busy, then 9;4;0"><span class="menu__grow">Progress ended</span></button>
      <button class="menu__item" type="button" @click="windowFocused = windowFocused === false"><span class="menu__grow" x-text="windowFocused ? 'Send IVE to background' : 'Bring IVE to front'"></span></button>
      <div class="menu__separator"></div>
      <a class="menu__item" href="index.html" title="The single-project mock: welcome screen, 10M lines, binary file"><span class="menu__grow">← Single-project mock</span></a>
    </div>
  </div>
  <button class="icon-button tabbar__settings" type="button" title="Settings" @click="openSettings()">
    <img class="icon icon--20" :src="icon('settings-20.svg')" alt="Settings" />
  </button>
  <div class="window-controls">
    <button type="button" title="Minimize"><span class="window-controls__icon" :style="{ '--mask': 'url(' + icon('window-minimize.svg') + ')' }"></span></button>
    <button type="button" title="Maximize"><span class="window-controls__icon" :style="{ '--mask': 'url(' + icon('window-maximize.svg') + ')' }"></span></button>
    <button class="window-controls__close" type="button" title="Close"><span class="window-controls__icon" :style="{ '--mask': 'url(' + icon('window-close.svg') + ')' }"></span></button>
  </div>
