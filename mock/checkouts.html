<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="IVE — projects and worktrees in one sidebar; project and worktree overviews, git views, scratches and Settings open as tabs." />
    <title>IVE checkouts</title>
    <link rel="stylesheet" href="./mock.css" />
    <link rel="stylesheet" href="./checkouts.css" />
    <link rel="stylesheet" href="./hub.css" />
    <link rel="stylesheet" href="./find.css" />
    <link rel="stylesheet" href="./ident.css" />
    <!-- Modules run in order before DOMContentLoaded, so the data exists before include.js starts Alpine. -->
    <script type="module" src="./checkouts-data.js"></script>
    <script type="module" src="./hub.js"></script>
    <script type="module" src="./find.js"></script>
    <script type="module" src="./route.js"></script>
    <script type="module" src="./menus.js"></script>
    <script type="module" src="./dnd.js"></script>
    <script type="module" src="./ident.js"></script>
    <script type="module" src="./checkouts.js"></script>
    <script src="./include.js"></script>
  </head>
  <body>
    <div class="desktop" x-data="checkouts" x-cloak @keydown.window.escape="menu = null"
         @keydown.window.alt.f12.prevent="openTerminal()" @keydown.window.ctrl.comma.prevent="openSettings()"
         @keydown.window.ctrl.e.prevent="openHub()" @keydown.window="groupKey($event); folderKey($event); newTerminalKey($event); findKey($event); clipKey($event)"
         @mousedown.window="findSideClick($event)">
      <div class="window" :class="{ 'window--behind': windowFocused === false }">
        <main class="window__content" :style="{ '--project-glow': projectGlow() }">
          <div class="fill" x-include="components/checkouts/sidebar.html"></div>
          <div class="fill" x-include="components/checkouts/editor.html"></div>
        </main>
        <!-- mock-only: the desktop's notifications (the OS draws them; a click raises IVE on that process) -->
        <div class="os-notices">
          <template x-for="n in desktopNotices" :key="n.c.id">
            <button class="os-notice" type="button" @click="showWaiting(n.c)">
              <span class="os-notice__app">IVE · desktop notification (mock)</span>
              <span class="os-notice__title" x-text="n.c.title + ' — ' + label(n.c.co)"></span>
              <span class="os-notice__text" x-text="n.text"></span>
            </button>
          </template>
        </div>
      </div>
    </div>
  </body>
</html>
