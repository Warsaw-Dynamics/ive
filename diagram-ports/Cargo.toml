[workspace]
members = ["engine"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
license = "LicenseRef-WarsawDynamics-Proprietary"

[workspace.dependencies]
merman = { version = "=0.9.2", default-features = false, features = ["all-diagrams", "svg", "layout-cytoscape"] }
roxmltree = "=0.21.1"
serde_json = "1.0"

[profile.dev.package."*"]
opt-level = 2
