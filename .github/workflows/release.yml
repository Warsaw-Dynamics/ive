# A push to the release branch builds IVE for Linux and publishes it as a GitHub Release, ive-<version>-<commit>.
name: release

on:
  push:
    branches: [release]

permissions:
  contents: write

jobs:
  linux:
    # the binary needs the build's glibc or newer: 22.04's 2.35 keeps it running on Ubuntu 22.04, Debian 12 and later
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libxkbcommon-dev libxkbcommon-x11-dev libfontconfig-dev \
            libfreetype-dev libwayland-dev libxcb1-dev libpipewire-0.3-dev libegl-dev libgbm-dev libclang-dev
      - name: Rust toolchain
        run: |
          version="$(awk '$1 == "rust" { print $2 }' .tool-versions)"
          rustup toolchain install "$version" --profile minimal
          rustup default "$version"
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        id: package
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ive") | .version')"
          tag="ive-$version-${GITHUB_SHA:0:10}"
          name="ive-linux-x86_64-${GITHUB_SHA:0:10}"
          mkdir -p "dist/$name"
          cp target/release/ive LICENSE NOTICE THIRD-PARTY-NOTICES.md "dist/$name/"
          cp -r desktop/icons licenses "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "file=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.package.outputs.tag }}" "${{ steps.package.outputs.file }}" \
            --target "$GITHUB_SHA" --title "${{ steps.package.outputs.tag }}" --generate-notes
