# A push to the release branch builds IVE for Linux, macOS and Windows and publishes them as one GitHub Release,
# ive-<version>-<commit>, with SHA256SUMS. Each build knows its tag (IVE_RELEASE_TAG), which makes it update itself.
name: release

on:
  push:
    branches: [release]

permissions:
  contents: write

jobs:
  linux:
    # the binary needs the build's glibc or newer: 22.04's 2.35 keeps it running on Ubuntu 22.04, Debian 12 and later
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libxkbcommon-dev libxkbcommon-x11-dev libfontconfig-dev \
            libfreetype-dev libwayland-dev libxcb1-dev libpipewire-0.3-dev libegl-dev libgbm-dev libclang-dev
      - name: Rust toolchain
        run: |
          version="$(awk '$1 == "rust" { print $2 }' .tool-versions)"
          rustup toolchain install "$version" --profile minimal
          rustup default "$version"
      - uses: Swatinem/rust-cache@v2
      - name: Release tag
        # the build compares it with the latest release's to find updates
        run: echo "IVE_RELEASE_TAG=ive-$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)-${GITHUB_SHA:0:10}" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          name="ive-linux-x86_64-${GITHUB_SHA:0:10}"
          mkdir -p "dist/$name"
          cp target/release/ive LICENSE NOTICE THIRD-PARTY-NOTICES.md "dist/$name/"
          cp -r desktop/icons licenses "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz

  macos:
    # Apple Silicon; the app is not signed or notarized, so macOS asks before its first start
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Rust toolchain
        run: |
          version="$(awk '$1 == "rust" { print $2 }' .tool-versions)"
          rustup toolchain install "$version" --profile minimal
          rustup default "$version"
      - uses: Swatinem/rust-cache@v2
      - name: Release tag
        # the build compares it with the latest release's to find updates
        run: echo "IVE_RELEASE_TAG=ive-$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)-${GITHUB_SHA:0:10}" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          name="ive-macos-arm64-${GITHUB_SHA:0:10}"
          mkdir -p "dist/$name"
          desktop/macos-bundle.sh "dist/$name/IVE.app" target/release/ive
          # the linker's ad-hoc signature covers the binary, not the bundle around it: a downloaded app signed so is
          # "damaged" to Gatekeeper, one signed as a whole only "unverified" (Open Anyway in System Settings)
          codesign --force --sign - "dist/$name/IVE.app"
          codesign --verify --strict --verbose=2 "dist/$name/IVE.app"
          cp LICENSE NOTICE THIRD-PARTY-NOTICES.md "dist/$name/"
          cp -r licenses "dist/$name/"
          ditto -c -k --keepParent "dist/$name" "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Rust toolchain
        run: |
          version="$(awk '$1 == "rust" { print $2 }' .tool-versions)"
          rustup toolchain install "$version" --profile minimal
          rustup default "$version"
      - uses: Swatinem/rust-cache@v2
      - name: Release tag
        # the build compares it with the latest release's to find updates
        run: echo "IVE_RELEASE_TAG=ive-$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)-${GITHUB_SHA:0:10}" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked
      - name: Package
        # ive-cli.exe runs terminal hosts and static servers; conpty.dll and OpenConsole.exe (build.rs copies them
        # from vendor/conpty) are the ConPTY the terminals run in
        run: |
          name="ive-windows-x86_64-${GITHUB_SHA:0:10}"
          mkdir -p "dist/$name/licenses"
          cp target/release/{ive.exe,ive-cli.exe,conpty.dll,OpenConsole.exe} LICENSE NOTICE THIRD-PARTY-NOTICES.md "dist/$name/"
          cp licenses/* "dist/$name/licenses/"
          cp vendor/conpty/LICENSE "dist/$name/licenses/conpty-LICENSE"
          (cd dist && 7z a -tzip "$name.zip" "$name")
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          tag="ive-$version-${GITHUB_SHA:0:10}"
          # IVE verifies an update's download against these
          (cd dist && sha256sum -- * > SHA256SUMS)
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "$tag" --generate-notes
