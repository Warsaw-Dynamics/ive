; IVE settings, in INI
# lines starting with ; or # are comments

[editor]
font_family = JetBrains Mono
font_size = 13
line_height = 1.4
soft_wrap = false
tab_width = 4

[terminal]
shell = /bin/bash
scrollback = 10000
copy_on_select = yes

[mcp]
enabled = true
port = 8765
token = change-me-to-16-chars

[project "ive"]
root = ~/Projects/ive
exclude = target, node_modules
