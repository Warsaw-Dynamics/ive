# `cargo about` (tools/third-party-notices.sh) writes THIRD-PARTY-NOTICES.md from Cargo.lock; the licences match
# deny.toml's allow list.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # IVE and ptyhost themselves (LICENSE); the template leaves them out
    "LicenseRef-WarsawDynamics-Proprietary",
]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
