[package]
name = "ive"
version = "0.1.0"
publish = false
license = "LicenseRef-WarsawDynamics-Proprietary"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1"
base64 = "0.23.1"
# 6, as gpui's font-kit, so one copy builds
dirs = "6.0.0"
futures = "0.3.34"
# the MCP server's HTTP/1.1 (rmcp brings the service, not a server)
hyper = { version = "1.12.0", features = ["server", "http1"] }
http-body-util = "0.1.5"
hyper-util = { version = "0.1.21", features = ["tokio"] }
getrandom = "0.4.3"
# libgit2 without network or SSH: IVE only reads local repositories
git2 = { version = "0.21.0", default-features = false }
# Zed's gpui with our fixes (Warsaw-Dynamics/pgui, branch zed-main: a snapshot of Zed plus one commit each).
# gpui is Apache-2.0.
gpui = { git = "https://github.com/Warsaw-Dynamics/pgui.git", rev = "f5d5fa2f8f07b0be68442e694d22ed6064609e73" }
gpui_platform = { git = "https://github.com/Warsaw-Dynamics/pgui.git", rev = "f5d5fa2f8f07b0be68442e694d22ed6064609e73", features = ["font-kit", "wayland", "x11"] }
# walks project folders without git, honouring .gitignore-style files (the hub's file list)
ignore = "0.4.33"
image = { version = "0.25.10", default-features = false, features = ["png"] }
libc = "0.2"
memchr = "2.8"
memmap2 = "0.9.11"
# OS file notifications (inotify, FSEvents, ReadDirectoryChangesW) for what IVE shows
notify = "8.2.0"
# the static server's rewrites
regex = "1.13.1"
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
rune = { version = "0.14.2", features = ["capture-io"] }
# the OS side of scripts; not signal (IVE handles signals) and not rand (no use yet); IVE's own `http` (over curl)
# and `toml` (over the toml crate) replace theirs, which pull in reqwest, rustls and a second toml
rune-modules = { version = "0.14.2", features = ["fs", "process", "json", "time", "io", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1"
streaming-iterator = "0.1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "macros", "sync", "time", "process"] }
toml = "1.1.8"
# vars.toml is edited in place, keeping the user's comments
toml_edit = "0.25.17"
# IVE_LOG diagnostics (src/trace.rs); tracing-log also routes gpui's `log` records there
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "std", "tracing-log", "ansi"] }
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cmake = "0.7.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-dart = "0.2.0"
tree-sitter-diff = "0.1.0"
tree-sitter-elixir = "0.3.5"
tree-sitter-elm = "5.9.4"
tree-sitter-embedded-template = "0.25.0"
tree-sitter-erlang = "0.21.0"
tree-sitter-fsharp = "0.3.12"
tree-sitter-gleam = "1.0.0"
tree-sitter-glsl = "0.2.0"
tree-sitter-go = "0.25.0"
tree-sitter-graphql = "0.3.0"
tree-sitter-groovy = "0.1.2"
tree-sitter-haskell = "0.24.1"
tree-sitter-hcl = "1.1.0"
tree-sitter-heex = "0.8.1"
tree-sitter-html = "0.23.2"
tree-sitter-ini = "1.4.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-jsdoc = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-julia = "0.23.1"
tree-sitter-kdl = "2.0.0"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-language = "0.1.9"
tree-sitter-lua = "0.5.0"
tree-sitter-make = "1.1.1"
tree-sitter-md = "0.5.3"
tree-sitter-nix = "0.3.0"
tree-sitter-objc = "3.0.2"
tree-sitter-ocaml = "0.26.0"
tree-sitter-php = "0.25.1"
tree-sitter-powershell = "0.26.4"
tree-sitter-properties = "0.3.0"
tree-sitter-proto = "0.6.0"
tree-sitter-python = "0.25.0"
tree-sitter-r = "1.3.0"
tree-sitter-regex = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-scala = "0.26.2"
tree-sitter-solidity = "1.2.13"
tree-sitter-starlark = "1.3.0"
tree-sitter-svelte-ng = "1.0.2"
tree-sitter-swift = "0.7.4"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-xml = "0.7.0"
tree-sitter-yaml = "0.7.2"
tree-sitter-zig = "1.1.2"
unicode-segmentation = "1.13.3"

[build-dependencies]
cc = "1.8.0"

[target.'cfg(target_os = "linux")'.dependencies]
# run configurations' secrets in the Secret Service (KWallet, GNOME Keyring); gpui already builds it with these features
oo7 = { version = "0.6.0", default-features = false, features = ["async-std", "native_crypto"] }

[target.'cfg(unix)'.dependencies]
# terminals that outlive IVE
ptyhost = { path = "ptyhost" }
# SIGTERM, SIGINT and SIGUSR1 through the quit flow
signal-hook = "0.4"

# run configurations' secrets in the Keychain
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
# Metal shaders compiled at startup: building them ahead needs the `metal` tool of a full Xcode, not just the Command
# Line Tools
gpui_platform = { git = "https://github.com/Warsaw-Dynamics/pgui.git", rev = "f5d5fa2f8f07b0be68442e694d22ed6064609e73", features = ["runtime_shaders"] }

[dev-dependencies]
tempfile = "3"

# Dependencies (memchr, gpui's renderer) are unusably slow unoptimised: opening a 10M-line file took
# 2.9 s in a plain debug build vs 0.09 s in release. Optimising them keeps `cargo run` representative.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
