[workspace]
members = [".", "codeview"]
# plain `cargo test` and `cargo clippy` from here cover the code view too
default-members = [".", "codeview"]

[package]
name = "ive"
version = "0.1.0"
publish = false
license = "LicenseRef-WarsawDynamics-Proprietary"
edition = "2024"
# ive-cli is Windows' console twin of ive
default-run = "ive"

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1"
base64 = "0.23.1"
# 6, as gpui's font-kit, so one copy builds
dirs = "6.0.0"
# canonical paths without the `\\?\` that std puts before them on Windows; std's own elsewhere
dunce = "1.0.5"
futures = "0.3.34"
# the MCP server's HTTP/1.1 (rmcp brings the service, not a server)
hyper = { version = "1.12.0", features = ["server", "http1"] }
http-body-util = "0.1.5"
hyper-util = { version = "0.1.21", features = ["tokio"] }
getrandom = "0.4.3"
# libgit2 without network or SSH: IVE only reads local repositories
git2 = { version = "0.21.0", default-features = false }
# Zed's gpui with our fixes (Warsaw-Dynamics/pgui, branch zed-main: a snapshot of Zed plus one commit each).
# gpui is Apache-2.0.
gpui = { git = "https://github.com/Warsaw-Dynamics/pgui.git", rev = "291caf391d12f25b353ec9baba14e5f135fdcc35" }
gpui_platform = { git = "https://github.com/Warsaw-Dynamics/pgui.git", rev = "291caf391d12f25b353ec9baba14e5f135fdcc35", features = ["font-kit", "wayland", "x11"] }
# the code view: syntax highlighting and colour keys
codeview = { path = "codeview" }
# walks project folders without git, honouring .gitignore-style files (the hub's file list)
ignore = "0.4.33"
image = { version = "0.25.10", default-features = false, features = ["png"] }
libc = "0.2"
memchr = "2.8"
# globs of menu conditions (`when: #{ name: "*.rs" }`); already built for `ignore`
globset = "0.4.20"
memmap2 = "0.9.11"
# OS file notifications (inotify, FSEvents, ReadDirectoryChangesW) for what IVE shows
notify = "8.2.0"
# terminals that outlive IVE
ptyhost = { path = "ptyhost" }
# the static server's rewrites
regex = "1.13.1"
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
rune = { version = "0.14.2", features = ["capture-io"] }
# the OS side of scripts; not signal (IVE handles signals) and not rand (no use yet); IVE's own `http` (over curl)
# and `toml` (over the toml crate) replace theirs, which pull in reqwest, rustls and a second toml
rune-modules = { version = "0.14.2", features = ["fs", "process", "json", "time", "io", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "macros", "sync", "time", "process"] }
toml = "1.1.8"
# vars.toml is edited in place, keeping the user's comments
toml_edit = "0.25.17"
# IVE_LOG diagnostics (src/trace.rs); tracing-log also routes gpui's `log` records there
# verifies update downloads; already built for gpui
sha2 = "0.10"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "std", "tracing-log", "ansi"] }
unicode-segmentation = "1.13.3"

[build-dependencies]
# the icon in ive.exe and ive-cli.exe; the version gpui already builds for its manifest
embed-resource = "3.0.12"

[target.'cfg(target_os = "linux")'.dependencies]
# run configurations' secrets in the Secret Service (KWallet, GNOME Keyring); gpui already builds it with these features
oo7 = { version = "0.6.0", default-features = false, features = ["async-std", "native_crypto"] }

[target.'cfg(unix)'.dependencies]
# SIGTERM, SIGINT and SIGUSR1 through the quit flow
signal-hook = "0.4"

# run configurations' secrets in the Keychain
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
# Metal shaders compiled at startup: building them ahead needs the `metal` tool of a full Xcode, not just the Command
# Line Tools
gpui_platform = { git = "https://github.com/Warsaw-Dynamics/pgui.git", rev = "291caf391d12f25b353ec9baba14e5f135fdcc35", features = ["runtime_shaders"] }

[target.'cfg(windows)'.dependencies]
# Print Screen puts a bitmap on the clipboard, saved as PNG when pasted
image = { version = "0.25.10", default-features = false, features = ["bmp", "png"] }
# run configurations' secrets in the Credential Manager
keyring = { version = "3.6.3", features = ["windows-native"] }
# other processes' children, command lines and working directories; the version gpui already locks
sysinfo = { version = "0.31.4", default-features = false, features = ["system"] }
# the version tokio and gpui already build
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_Shell"] }

[dev-dependencies]
codeview = { path = "codeview", features = ["test-support"] }
# gpui's test app, for driving a file tab's saves in unit tests
gpui = { git = "https://github.com/Warsaw-Dynamics/pgui.git", rev = "291caf391d12f25b353ec9baba14e5f135fdcc35", features = ["test-support"] }
tempfile = "3"

# Dependencies (memchr, gpui's renderer) are unusably slow unoptimised: opening a 10M-line file took
# 2.9 s in a plain debug build vs 0.09 s in release. Optimising them keeps `cargo run` representative.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
